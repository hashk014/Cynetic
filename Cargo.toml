[package]
name = "cynetic"
version = "0.2.0"
edition = "2024"

[dependencies]
wry = "0.58"
tao = "0.38"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "Cynetic"
path = "src/main.rs"
